<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d5d8a">
<title>25학번 자봉 장부</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="자봉">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231d5d8a'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>자</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eaf0ef; --surface:#ffffff; --sunk:#f3f7f6; --ink:#15232a; --muted:#5a6d73; --line:#d3dedc;
  --accent:#1d5d8a; --accent-ink:#ffffff; --accent-soft:#dde9f2;
  --pen:#bf3a2b; --pen-soft:#f8e3df; --hot:#8f2418; --hot-soft:#f1c9c2;
  --merit:#2c7a4c; --merit-soft:#dcefe3; --warn:#9a6412; --warn-soft:#f6ead2;
  --bubble:#fff6bf; --bubble-ink:#2a2610;
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1619; --surface:#162226; --sunk:#111b1e; --ink:#e3ecea; --muted:#94a7ab; --line:#29393d;
  --accent:#6aa8d6; --accent-ink:#0b1a24; --accent-soft:#1c3444;
  --pen:#ef7465; --pen-soft:#3a2220; --hot:#ffb3a7; --hot-soft:#5a2a24;
  --merit:#67c28c; --merit-soft:#1b3326; --warn:#e3b264; --warn-soft:#3a2e18;
  --bubble:#3a3620; --bubble-ink:#f4ecc4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1619; --surface:#162226; --sunk:#111b1e; --ink:#e3ecea; --muted:#94a7ab; --line:#29393d;
  --accent:#6aa8d6; --accent-ink:#0b1a24; --accent-soft:#1c3444;
  --pen:#ef7465; --pen-soft:#3a2220; --hot:#ffb3a7; --hot-soft:#5a2a24;
  --merit:#67c28c; --merit-soft:#1b3326; --warn:#e3b264; --warn-soft:#3a2e18;
  --bubble:#3a3620; --bubble-ink:#f4ecc4;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.app{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.no,.pts,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:6px}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.mocknote{font-size:12px;color:var(--muted)}
.photo-btn{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--accent)}
.photo-big{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.boot{padding:48px 0;text-align:center;color:var(--muted)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
.live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin:4px 0 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--merit);box-shadow:0 0 0 3px var(--merit-soft)}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35}}}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:120px}
input[type=text],input[type=search],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea{resize:vertical;min-height:70px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:1px}
.tile .no{font-size:17px;font-weight:600}
.tile .pt{font-size:11px;color:var(--muted)}
.grid.named{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}
.tile .nm{font-size:12px;font-weight:500;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fld>span{font-weight:500}
.row2{display:flex;gap:8px}.row2 .grow{flex:1}.pts-fld{width:92px}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:4px}
.chip{font-family:var(--mono);font-size:13px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip{border:0}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12px;padding:2px 0;text-align:left}
.ptsbox{position:relative}
.ptsbox input{padding-right:40px}
.ptsbox .ptsdrop{position:absolute;top:1px;right:1px;bottom:1px;width:36px;border:0;border-left:1px solid var(--line);border-radius:0 9px 9px 0;background:var(--sunk);color:var(--accent);font-size:13px;padding:0}
.ptspop{position:absolute;right:0;top:calc(100% + 4px);z-index:20;display:grid;grid-template-columns:repeat(5,40px);gap:4px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgb(0 0 0/.14)}
.ptspop button{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:var(--mono);font-weight:600;font-size:14px;padding:0}
.ptspop button.p{color:var(--pen)}.ptspop button.m{color:var(--merit)}
.ptspop button:active{background:var(--accent-soft)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}
.pickgrid button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;min-width:0}
.pickgrid b{font-family:var(--mono);font-size:15px}
.pickgrid span{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
.pickgrid button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pickgrid button.on span{color:var(--accent-ink)}
details.card summary{cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:-4px}
.sugg button{border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:9px 12px}
.sugg button:first-child{border-top:0}
.sugg button:hover{background:var(--sunk)}
.chip.bad{background:var(--pen-soft);color:var(--pen)}
.sugbox{display:flex;flex-direction:column;gap:6px;margin-top:-4px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.sug-g{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.sug-l{font-size:11px;font-weight:600;color:var(--muted);flex:0 0 auto}
.sugbox button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugbox button:active{background:var(--accent-soft)}
.sugbox button b{font-family:var(--mono);font-weight:600}.sugbox b.p{color:var(--pen)}.sugbox b.m{color:var(--merit)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px;font-weight:500}
.btn.danger{background:var(--pen);color:#fff}
.btn.ok{background:var(--merit);color:#fff}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px}

.back{border:0;background:none;color:var(--accent);padding:0;font-size:14px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero .big{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1}
.hero .big.p{color:var(--pen)}.hero .big.m{color:var(--merit)}
.day{font-size:12px;color:var(--muted);font-weight:600;margin:6px 0 2px}
.evs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.ev-main{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ev .item em{font-style:normal;color:var(--muted);font-size:13px;margin-left:4px}
.ev .pts{font-weight:600}
.pts.p{color:var(--pen)}.pts.m{color:var(--merit)}
.ev.void .item,.ev.void .pts{text-decoration:line-through;color:var(--muted)}
.note{font-size:12px;color:var(--muted)}
.revbtn{align-self:flex-start;border:0;background:var(--warn-soft);color:var(--warn);font-size:12px;padding:2px 8px;border-radius:6px}
.rev{border-left:2px solid var(--warn);padding:2px 0 2px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.rev b{color:var(--ink);font-weight:500}

.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--merit-soft);color:var(--merit)}
.pill.rejected{background:var(--pen-soft);color:var(--pen)}
.req-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.req-body{font-size:14px}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.att button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font-family:var(--mono);font-weight:600;font-size:16px}
.att button small{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--muted)}
.att button.late{background:var(--warn-soft);border-color:var(--warn)}.att button.late small{color:var(--warn)}
.att button.absent{background:var(--pen-soft);border-color:var(--pen)}.att button.absent small{color:var(--pen)}
.att button.excused{background:var(--accent-soft);border-color:var(--accent)}.att button.excused small{color:var(--accent)}
.att button .nm{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink)}
.calls{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.call{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.call:first-child{border-top:0}
.call .no{font-size:16px;font-weight:600;text-align:right}
.call .nm{font-size:16px;font-weight:500}
.call.late{background:var(--warn-soft)}.call.absent{background:var(--pen-soft)}.call.excused{background:var(--accent-soft)}
.st4{display:flex;gap:3px}
.st4 button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:13px;color:var(--muted)}
.st4 button.on.present{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st4 button.on.late{background:var(--warn);color:#fff;border-color:var(--warn)}
.st4 button.on.absent{background:var(--pen);color:#fff;border-color:var(--pen)}
.st4 button.on.excused{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (max-width:380px){.st4 button{padding:6px 6px}}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th,.tbl td{padding:6px 9px;border-top:1px solid var(--line);text-align:left}
.tbl thead th{border-top:0;background:var(--sunk);color:var(--muted);font-weight:600;font-size:12px}
.tbl tr.off td{color:var(--muted);text-decoration:line-through}
.att-confirm{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.att-foot{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 6px 18px rgb(0 0 0/.08)}

.bubble{background:var(--bubble);color:var(--bubble-ink);border:0;border-radius:4px 16px 16px 16px;padding:12px 14px;min-height:280px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.rec-row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.rec-row:first-child{border-top:0}
.rec-row .d{font-size:12px;color:var(--muted)}
.rec-row .acts{grid-column:1/-1;display:flex;gap:6px}
.edit{grid-column:1/-1;background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow input{width:76px;min-width:0}
.mrow .grow{flex:1;min-width:0}
.mrow .btn,.mrow .pill,.mrow .note{flex-shrink:0;white-space:nowrap}
.mlist{max-height:320px;overflow:auto}
.off{color:var(--muted)}

.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tabs:empty{display:none}
.top:has(.tabs:empty){padding-bottom:10px}
.tabs button{flex:1 0 auto;border:0;background:none;padding:10px 10px 11px;font-size:14px;color:var(--muted);font-weight:500;position:relative;white-space:nowrap}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;background:var(--accent);border-radius:3px 3px 0 0}
.badge{display:inline-block;min-width:17px;padding:0 5px;margin-left:3px;border-radius:999px;background:var(--pen);color:#fff;font-size:11px;line-height:17px;font-family:var(--mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:9;max-width:calc(100% - 32px);display:flex;align-items:center;gap:12px}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:var(--accent-soft);font-weight:700;font-size:13px;padding:2px 0;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
.tile.me{border:2px solid var(--accent)}
.mycard .rec-row{padding:6px 0}
.mybal{font-family:var(--mono);font-size:20px;font-weight:600}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 0}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">25학번 자봉</div>
      <div class="seg" id="roles">
        <button data-act="role" data-role="student">학생</button>
        <button data-act="role" data-role="officer">총대단</button>
        <button data-act="role" data-role="admin">부총대</button>
      </div>
    </div>
    <div class="top-row" id="subbar"></div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"><p class="boot">불러오는 중…</p></main>
</div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
