name: 테스트

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 유닛 테스트
        run: npm test
      - name: 빌드
        run: npm run build
      - name: DB 흐름 테스트
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin" -c "create role authenticated nologin" -c "create database jabong"
          psql -d jabong -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -d jabong -v ON_ERROR_STOP=1 -f supabase/tests/flow.sql
