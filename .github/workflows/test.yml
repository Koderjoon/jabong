name: 테스트

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 유닛 테스트
        run: npm test
      - name: 빌드
        run: npm run build
      - name: DB 테스트 (흐름 · 모든 서버 함수 · 작업 내역)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:db
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 브라우저 전체 기능 테스트
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:e2e
      - name: 실패하면 테스트 중 받은 파일 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e/out
