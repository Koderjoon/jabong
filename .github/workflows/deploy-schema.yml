name: 서버 반영

# supabase/schema.sql을 실제 Supabase 데이터베이스에 실행한다 (SQL Editor에 붙여넣고 Run을 누르는 것과 같다).
# 자동으로 돌지 않는다: Actions 탭 → "서버 반영" → Run workflow를 눌렀을 때만.
# 데이터(학생·기록·출석)는 지우지 않고 표·함수만 새로 맞춘다. 한 덩어리(트랜잭션)로 실행해서, 중간에 실패하면 아무것도 바뀌지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-schema
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이 버전의 테스트가 통과했는지 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          c=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
            --jq '[.workflow_runs[] | select(.name == "테스트")] | first | (.status + " " + (.conclusion // ""))')
          echo "테스트 상태: ${c:-없음}"
          if [ "$c" != "completed success" ]; then
            echo "::error::이 버전(${GITHUB_SHA::7})의 테스트가 아직 통과하지 않았어요 (${c:-기록 없음}). 테스트가 초록불이 된 뒤에 다시 눌러 주세요."
            exit 1
          fi

      - name: 접속 주소 확인
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::저장소 Secrets에 SUPABASE_DB_URL을 넣어 주세요 (README '서버 반영 버튼' 절)"; exit 1
          fi
          case "$DB_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::SUPABASE_DB_URL은 postgresql:// 로 시작하는 접속 주소여야 해요"; exit 1 ;;
          esac
          case "$DB_URL" in
            *"@db."*".supabase.co"*) echo "::error::이 주소(Direct connection)는 GitHub에서 접속할 수 없어요. Supabase의 Connect → 'Session pooler' 주소를 넣어 주세요"; exit 1 ;;
            *"[YOUR-PASSWORD]"*) echo "::error::주소 안의 [YOUR-PASSWORD]를 실제 데이터베이스 비밀번호로 바꿔 넣어 주세요"; exit 1 ;;
          esac

      - name: schema.sql 실행
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          # 앱을 쓰는 중이면 표 잠금이 앱의 요청과 엇갈려 교착(deadlock)이나 잠금 대기 시간 초과가 날 수 있다.
          # 한 덩어리로 실행해서 실패하면 아무것도 바뀌지 않으니, 그때는 잠깐 쉬었다가 다시 한다 (최대 4번).
          # 잠금을 오래 기다리지 않게 해서(5초) 그동안 앱 요청이 줄줄이 멈추지 않게 한다.
          export PGOPTIONS='-c lock_timeout=5s'
          for try in 1 2 3 4; do
            set +e
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -1 -f supabase/schema.sql > out.txt 2>&1
            code=$?
            set -e
            [ "$code" -eq 0 ] && break
            grep -qE 'deadlock detected|lock timeout|canceling statement due to lock timeout' out.txt || break
            echo "앱이 쓰는 중이라 잠깐 엇갈렸어요 ($try번째). 15초 뒤 다시 해요."
            sleep 15
          done
          grep -v 'NOTICE' out.txt || true
          if [ "$code" -ne 0 ]; then
            # psql이 남긴 오류를 요약(Annotations)에도 띄운다. 비밀번호는 GitHub이 가린다
            msg=$(grep -E 'ERROR|FATAL|error|could not|timeout' out.txt | grep -v NOTICE | head -3 | tr '\n' ' ' | cut -c1-400)
            echo "::error::psql: ${msg:-알 수 없는 오류 (종료 코드 $code)}"
            hint=""
            case "$msg" in
              *"password authentication failed"*) hint="데이터베이스 비밀번호가 틀렸어요. Supabase에서 비밀번호를 확인(또는 Reset)하고 SUPABASE_DB_URL을 고쳐 주세요" ;;
              *"Tenant or user not found"*) hint="주소의 사용자 이름이 맞지 않아요. Session pooler 주소를 그대로(postgres.프로젝트ID 형태) 복사해 주세요" ;;
              *"could not translate host name"*|*"Name or service not known"*) hint="주소의 서버 이름이 틀렸어요. Session pooler 주소를 다시 복사해 주세요" ;;
              *"Network is unreachable"*|*"timeout"*|*"Connection refused"*) hint="서버에 접속하지 못했어요. Session pooler 주소인지, 포트가 5432인지 확인해 주세요" ;;
              *"permission denied"*|*"must be owner"*) hint="권한이 부족해요. 주소의 사용자가 postgres인지 확인해 주세요" ;;
              *"deadlock detected"*|*"lock timeout"*) hint="앱을 쓰는 사람이 많아 여러 번 엇갈렸어요. 몇 분 뒤(사람이 적을 때) 다시 눌러 주세요" ;;
            esac
            [ -n "$hint" ] && echo "::error::$hint"
            echo "::error::실행 중 오류가 나서 아무것도 바꾸지 않았어요. 장부 데이터는 그대로예요."
            exit 1
          fi
          echo "반영했어요 (${GITHUB_SHA::7}). 앱을 새로고침하면 새 기능이 동작해요."
